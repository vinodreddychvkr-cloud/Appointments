server.port=8082
spring.application.name=APPOINTMENTS

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Appointments Service
info.app.description=Handles appointment bookings
info.app.version=1.0.0
info.app.owner=Hospital Management System

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/vinod?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=vinod

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# KAFKA COMMON CONFIG
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

# ===============================
# PRODUCER CONFIG
# ===============================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ===============================
# CONSUMER CONFIG
# ===============================
spring.kafka.consumer.group-id=hospital-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ===============================
# OPTIONAL (RECOMMENDED)
# ===============================
spring.kafka.listener.missing-topics-fatal=false